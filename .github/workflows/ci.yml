name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  check:
    name: Test and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Verify release version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Tag ${process.env.RELEASE_TAG} does not match package version v${version}`);
          }
          NODE
      - run: npm ci
      - run: npm run compile
      - run: npm test
      - name: Package Chrome extension
        run: npm run zip
      - name: Check Firefox build compatibility
        run: npm run build:firefox
      - name: Upload Chrome package
        uses: actions/upload-artifact@v7
        with:
          name: chrome-extension
          path: .output/*-chrome.zip
          include-hidden-files: true
          if-no-files-found: error
